# ==========================================
# 1. Base de datos en AWS RDS (PostgreSQL)
# ==========================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:tu-endpoint.rds.amazonaws.com}:5432/${DB_NAME:pedidos360}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:tu_contrasena}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# 2. Seguridad Azure / MSAL
# ==========================================
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.client-id=70a98cd7-3e6e-4e11-a209-d0ae414fb4db
spring.cloud.azure.active-directory.app-id-uri=api://70a98cd7-3e6e-4e11-a209-d0ae414fb4db

# ==========================================
# 3. Configuración JWT
# ==========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/015cad58-1396-4898-9f0a-4cb1e1191c38/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=70a98cd7-3e6e-4e11-a209-d0ae414fb4db

# ==========================================
# 4. Logs de Seguridad
# ==========================================
logging.level.org.springframework.security=TRACE