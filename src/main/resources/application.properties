# Base de Datos en Memoria (H2)
spring.datasource.url=jdbc:h2:mem:pedidosdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Seguridad Azure / MSAL
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.client-id=70a98cd7-3e6e-4e11-a209-d0ae414fb4db
spring.cloud.azure.active-directory.app-id-uri=api://70a98cd7-3e6e-4e11-a209-d0ae414fb4db

# Configuracion JWT (Sin el api:// en el audience)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/015cad58-1396-4898-9f0a-4cb1e1191c38/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=70a98cd7-3e6e-4e11-a209-d0ae414fb4db

# Mostrar errores ocultos de seguridad
logging.level.org.springframework.security=TRACE