server.port=8080
spring.application.name=pedidos-service

# --- Base de datos en AWS RDS (PostgreSQL) ---
# Se leen de variables de entorno para no subir credenciales a GitHub:
#   DB_HOST, DB_USER, DB_PASSWORD  (y opcional DB_PORT, DB_NAME)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:pedidos360}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Validacion del JWT de Azure AD ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/015cad58-1396-4898-9f0a-4cb1e1191c38/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=82adc866-3948-44f8-993d-5658734ad794

# --- CORS (en AWS: CORS_ALLOWED_ORIGINS=https://tu-front,https://tu-api-gateway) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
management.endpoints.web.exposure.include=health